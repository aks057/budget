# Local development: Postgres only. Run the backend with `./gradlew bootRun` from backend/.
# The production stack (caddy + frontend + backend + postgres) lives in deploy/docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: budwiser-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-budwiser}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - budwiser-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  budwiser-pgdata:
